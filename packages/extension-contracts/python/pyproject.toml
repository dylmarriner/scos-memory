[project]
name = "scos-extension"
version = "1.0.0"
description = "SCOS extension manifest contracts and Ed25519 signature verification"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scos_extension"]
