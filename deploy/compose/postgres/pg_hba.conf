# Client authentication for the compose PostgreSQL service, passed with
# -c hba_file. It is the official image's generated pg_hba.conf plus one
# line: backup-manager's pg_basebackup (point-in-time recovery base backups)
# connects over TLS from another container with the replication protocol,
# which "host all all all" does not cover. Only a role with the REPLICATION
# attribute can use it.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
hostssl replication     all             all                     scram-sha-256
host    all             all             all                     scram-sha-256
