# Optional SCOS retrieval-model overlay for the hosted Linode deployment.
#
# model-runtime stays inside the SCOS service network. Inference can run in
# local TEI containers on the Linode or at explicitly configured backend URLs.
# No model service is published through Nginx and none accepts customer API
# keys.
#
# Enable deployment with:
#   SCOS_MODEL_RUNTIME_ENABLED=true
#   SCOS_MODEL_PROFILES=text-model
#
# Start reranker/code profiles only when their consumers are enabled and the
# Linode has enough RAM/CPU, or point SCOS_MODEL_*_URL at another governed
# inference backend.

services:
  model-runtime-tls-certs:
    image: alpine:3.21
    restart: "no"
    volumes:
      - model-runtime-tls:/etc/scos/model-runtime-tls
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        if [ -f /etc/scos/model-runtime-tls/tls.crt ] && [ -f /etc/scos/model-runtime-tls/tls.key ]; then
          echo "model-runtime-tls-certs: existing certificate found"
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
          -keyout /etc/scos/model-runtime-tls/tls.key \
          -out /etc/scos/model-runtime-tls/tls.crt \
          -subj "/O=scos-model-runtime-dev" \
          -addext "subjectAltName=DNS:model-runtime,DNS:localhost,IP:127.0.0.1"
        chown 100:101 /etc/scos/model-runtime-tls/tls.key /etc/scos/model-runtime-tls/tls.crt
        chmod 600 /etc/scos/model-runtime-tls/tls.key
        chmod 644 /etc/scos/model-runtime-tls/tls.crt

  model-runtime:
    build:
      context: ../..
      dockerfile: services/model-runtime/Dockerfile
    restart: unless-stopped
    mem_limit: ${SCOS_MODEL_RUNTIME_MEM_LIMIT:-192m}
    memswap_limit: ${SCOS_MODEL_RUNTIME_MEM_LIMIT:-192m}
    cpus: ${SCOS_MODEL_RUNTIME_CPUS:-1}
    environment:
      SCOS_INTERNAL_SERVICE_TOKEN: ${SCOS_INTERNAL_SERVICE_TOKEN:?SCOS_INTERNAL_SERVICE_TOKEN must be set}
      SCOS_CONTROL_PLANE_TOKEN: ${SCOS_CONTROL_PLANE_TOKEN:?SCOS_CONTROL_PLANE_TOKEN must be set}
      SCOS_SERVICE_IDENTITY: ${SCOS_SERVICE_IDENTITY_PREFIX:-scos-service}-model-runtime
      SCOS_TLS_REQUIRED: "true"
      SCOS_TLS_CERT_FILE: /etc/scos/model-runtime-tls/tls.crt
      SCOS_TLS_KEY_FILE: /etc/scos/model-runtime-tls/tls.key
      SCOS_TLS_CA_FILE: /etc/scos/model-runtime-tls/tls.crt
      SCOS_MODEL_RUNTIME_HTTP_ADDR: ${SCOS_MODEL_RUNTIME_HTTP_ADDR:-:8103}
      SCOS_MODEL_RUNTIME_TIMEOUT_SECONDS: ${SCOS_MODEL_RUNTIME_TIMEOUT_SECONDS:-60}

      SCOS_MODEL_TEXT_URL: ${SCOS_MODEL_TEXT_URL:-http://bge-m3:80}
      SCOS_MODEL_TEXT_MODEL: ${SCOS_MODEL_TEXT_MODEL:-BAAI/bge-m3}
      SCOS_MODEL_TEXT_REVISION: ${SCOS_MODEL_TEXT_REVISION:-main}
      SCOS_MODEL_TEXT_DIMENSIONS: ${SCOS_MODEL_TEXT_DIMENSIONS:-1024}
      SCOS_MODEL_TEXT_REQUIRED: ${SCOS_MODEL_TEXT_REQUIRED:-true}

      SCOS_MODEL_RERANK_URL: ${SCOS_MODEL_RERANK_URL:-http://bge-reranker:80}
      SCOS_MODEL_RERANK_MODEL: ${SCOS_MODEL_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      SCOS_MODEL_RERANK_REVISION: ${SCOS_MODEL_RERANK_REVISION:-main}
      SCOS_MODEL_RERANK_REQUIRED: ${SCOS_MODEL_RERANK_REQUIRED:-false}

      SCOS_MODEL_CODE_URL: ${SCOS_MODEL_CODE_URL:-http://bge-code:80}
      SCOS_MODEL_CODE_MODEL: ${SCOS_MODEL_CODE_MODEL:-BAAI/bge-code-v1}
      SCOS_MODEL_CODE_REVISION: ${SCOS_MODEL_CODE_REVISION:-main}
      SCOS_MODEL_CODE_DIMENSIONS: ${SCOS_MODEL_CODE_DIMENSIONS:-1536}
      SCOS_MODEL_CODE_REQUIRED: ${SCOS_MODEL_CODE_REQUIRED:-false}
    volumes:
      - model-runtime-tls:/etc/scos/model-runtime-tls:ro
    expose:
      - "8103"
    depends_on:
      model-runtime-tls-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1:8103/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 10

  retrieval-orchestrator:
    environment:
      SCOS_MODEL_RUNTIME_URL: ${SCOS_MODEL_RUNTIME_URL:-https://model-runtime:8103}
      SCOS_MODEL_RUNTIME_CA_FILE: /etc/scos/model-runtime-tls/tls.crt
      SCOS_INTERNAL_SERVICE_TOKEN: ${SCOS_INTERNAL_SERVICE_TOKEN:?SCOS_INTERNAL_SERVICE_TOKEN must be set}
      SCOS_CONTROL_PLANE_TOKEN: ${SCOS_CONTROL_PLANE_TOKEN:?SCOS_CONTROL_PLANE_TOKEN must be set}
      SCOS_MODEL_TEXT_PROVIDER: ${SCOS_MODEL_TEXT_PROVIDER:-scos-model-runtime}
      SCOS_MODEL_TEXT_MODEL: ${SCOS_MODEL_TEXT_MODEL:-BAAI/bge-m3}
      SCOS_MODEL_TEXT_REVISION: ${SCOS_MODEL_TEXT_REVISION:-main}
      SCOS_MODEL_TEXT_DIMENSIONS: ${SCOS_MODEL_TEXT_DIMENSIONS:-1024}
      SCOS_MODEL_TEXT_GENERATION: ${SCOS_MODEL_TEXT_GENERATION:-1}
      SCOS_MODEL_RERANK_MODEL: ${SCOS_MODEL_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      SCOS_MODEL_RERANK_REVISION: ${SCOS_MODEL_RERANK_REVISION:-main}
      SCOS_MODEL_RERANK_CANDIDATES: ${SCOS_MODEL_RERANK_CANDIDATES:-50}
    volumes:
      - model-runtime-tls:/etc/scos/model-runtime-tls:ro
    depends_on:
      model-runtime:
        condition: service_healthy

  code-intelligence:
    environment:
      SCOS_MODEL_RUNTIME_URL: ${SCOS_MODEL_RUNTIME_URL:-https://model-runtime:8103}
      SCOS_MODEL_RUNTIME_CA_FILE: /etc/scos/model-runtime-tls/tls.crt
      SCOS_INTERNAL_SERVICE_TOKEN: ${SCOS_INTERNAL_SERVICE_TOKEN:?SCOS_INTERNAL_SERVICE_TOKEN must be set}
      SCOS_CONTROL_PLANE_TOKEN: ${SCOS_CONTROL_PLANE_TOKEN:?SCOS_CONTROL_PLANE_TOKEN must be set}
      SCOS_MODEL_CODE_PROVIDER: ${SCOS_MODEL_CODE_PROVIDER:-scos-model-runtime}
      SCOS_MODEL_CODE_MODEL: ${SCOS_MODEL_CODE_MODEL:-BAAI/bge-code-v1}
      SCOS_MODEL_CODE_REVISION: ${SCOS_MODEL_CODE_REVISION:-main}
      SCOS_MODEL_CODE_DIMENSIONS: ${SCOS_MODEL_CODE_DIMENSIONS:-1536}
      SCOS_MODEL_CODE_GENERATION: ${SCOS_MODEL_CODE_GENERATION:-1}
    volumes:
      - model-runtime-tls:/etc/scos/model-runtime-tls:ro
    depends_on:
      model-runtime:
        condition: service_healthy

  embeddings-worker:
    environment:
      SCOS_MODEL_RUNTIME_URL: ${SCOS_MODEL_RUNTIME_URL:-https://model-runtime:8103}
      SCOS_MODEL_RUNTIME_CA_FILE: /etc/scos/model-runtime-tls/tls.crt
      SCOS_INTERNAL_SERVICE_TOKEN: ${SCOS_INTERNAL_SERVICE_TOKEN:?SCOS_INTERNAL_SERVICE_TOKEN must be set}
      SCOS_CONTROL_PLANE_TOKEN: ${SCOS_CONTROL_PLANE_TOKEN:?SCOS_CONTROL_PLANE_TOKEN must be set}
      SCOS_EMBED_MODEL: ${SCOS_MODEL_TEXT_MODEL:-BAAI/bge-m3}
      SCOS_EMBED_MODEL_REVISION: ${SCOS_MODEL_TEXT_REVISION:-main}
      SCOS_EMBED_DIMENSIONS: ${SCOS_MODEL_TEXT_DIMENSIONS:-1024}
      SCOS_EMBED_GENERATION: ${SCOS_MODEL_TEXT_GENERATION:-1}
      SCOS_EMBEDDINGS_BATCH_SIZE: ${SCOS_EMBEDDINGS_BATCH_SIZE:-8}
    volumes:
      - model-runtime-tls:/etc/scos/model-runtime-tls:ro
    depends_on:
      model-runtime:
        condition: service_healthy

  # These local TEI commands consume the same model/revision variables the
  # runtime advertises. That prevents a configured revision from being
  # metadata-only while TEI silently loads a different one.
  bge-m3:
    image: ${SCOS_TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    profiles: ["text-model"]
    restart: unless-stopped
    command: ["--model-id", "${SCOS_MODEL_TEXT_MODEL:-BAAI/bge-m3}", "--revision", "${SCOS_MODEL_TEXT_REVISION:-main}", "--port", "80"]
    volumes:
      - bge-m3-cache:/data
    expose:
      - "80"

  bge-reranker:
    image: ${SCOS_TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    profiles: ["rerank-model"]
    restart: unless-stopped
    command: ["--model-id", "${SCOS_MODEL_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}", "--revision", "${SCOS_MODEL_RERANK_REVISION:-main}", "--port", "80"]
    volumes:
      - bge-reranker-cache:/data
    expose:
      - "80"

  bge-code:
    image: ${SCOS_TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    profiles: ["code-model"]
    restart: unless-stopped
    command: ["--model-id", "${SCOS_MODEL_CODE_MODEL:-BAAI/bge-code-v1}", "--revision", "${SCOS_MODEL_CODE_REVISION:-main}", "--port", "80"]
    volumes:
      - bge-code-cache:/data
    expose:
      - "80"

volumes:
  model-runtime-tls:
  bge-m3-cache:
  bge-reranker-cache:
  bge-code-cache:
