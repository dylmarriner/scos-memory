# Local development / failure-injection testing overlay.
#
# This file is NOT part of the production deployment. It adds a minimal
# stub agent endpoint so the Autonomous Cognitive Control Plane has
# something to dispatch to when running `make failure-injection` or manual
# compose smoke tests locally, without requiring a real hosted agent.
#
# Usage:
#   docker compose -f deploy/compose/docker-compose.yml \
#                   -f deploy/compose/docker-compose.override.dev.yml up -d
#
# Never reference this file from production tooling or CI release paths.

services:
  stub-agent:
    image: python:3.12-alpine
    restart: unless-stopped
    command:
      - python3
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def log_message(self, *args):
                pass

            def do_POST(self):
                length = int(self.headers.get("Content-Length", "0"))
                raw = self.rfile.read(length) if length else b"{}"
                try:
                    payload = json.loads(raw or b"{}")
                except json.JSONDecodeError:
                    payload = {}
                reply = {
                    "content": "stub-agent deterministic reply for interaction "
                    + str(payload.get("interaction_id", "unknown")),
                }
                body = json.dumps(reply).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def do_GET(self):
                body = b'{"status":"ok"}'
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        ThreadingHTTPServer(("0.0.0.0", 9999), Handler).serve_forever()
    expose:
      - "9999"

  autonomous-control-plane:
    environment:
      SCOS_AGENT_ENDPOINT: http://stub-agent:9999/agent
    depends_on:
      stub-agent:
        condition: service_started
    ports:
      - "8081:8081"

  # The production compose file intentionally publishes no host ports --
  # every governed service is reachable only inside the compose network.
  # tests/failure-injection/runner.py, however, drives probes from the host
  # against http://127.0.0.1:<port> (packages/routing-contracts's
  # SERVICE_PORTS table). Publish exactly those ports here so failure
  # injection can run against a real stack without weakening the production
  # network boundary.
  memory-gateway:
    ports:
      - "8080:8080"
  retrieval-orchestrator:
    ports:
      - "8082:8082"
  context-optimisation:
    ports:
      - "8083:8083"
  code-intelligence:
    ports:
      - "8084:8084"
  execution-proxy:
    ports:
      - "8085:8085"
  extension-manager:
    ports:
      - "8086:8086"
  hermes-provider:
    ports:
      - "8088:8088"
  memory-intelligence:
    ports:
      - "8089:8089"
  mcp-gateway:
    ports:
      - "8098:8098"
  security-gate:
    ports:
      - "8091:8091"
  tool-governance:
    ports:
      - "8092:8092"
  agent-registry:
    ports:
      - "8093:8093"
