    restart: unless-stopped
    environment:
      <<: [*service-auth-environment, *service-tls-environment, *service-runtime-environment]
      SCOS_GRAPHIFY_PROVIDER_HTTP_ADDR: ${SCOS_GRAPHIFY_PROVIDER_HTTP_ADDR:-:8099}
      SCOS_MEMORY_INTELLIGENCE_URL: ${SCOS_MEMORY_INTELLIGENCE_URL:-https://memory-intelligence:8089}
      GRAPHIFY_REPO_PATH: ${GRAPHIFY_REPO_PATH:-/repo}
      # Left optional rather than compose-required: these must be a real
      # tenant/principal/namespace already provisioned with a
      # namespace_memberships row (can_write_candidates=true) for ingestion
      # to succeed, which isn't something this file can invent. Unset, the
      # service still starts and serves /health and the read-side
      # query/path/explain tools -- handleExtract (main.go) itself returns
      # 412 for POST /v1/graphify/extract until these are set.
      GRAPHIFY_NAMESPACE_ID: ${GRAPHIFY_NAMESPACE_ID:-}
      GRAPHIFY_TENANT_ID: ${GRAPHIFY_TENANT_ID:-}
      GRAPHIFY_PRINCIPAL_ID: ${GRAPHIFY_PRINCIPAL_ID:-}
      GRAPHIFY_BACKEND: ${GRAPHIFY_BACKEND:-}
    volumes:
      - tls-certs:/etc/scos/tls:ro
      # Relative to this compose file's own directory (deploy/compose/), so
      # the default resolves to the repo root -- not deploy/ itself, which
      # is what "../.." vs. a bare ".." would silently get wrong.
      # Read-write: `graphify extract` (query/path/explain all read its
      # cached graphify-out/graph.json) writes into the repo root itself,
      # the same way running graphify locally in your own checkout would.
      - ${GRAPHIFY_REPO_HOST_PATH:-../..}:/repo:rw
      # graphify's own AST-parse cache (per-repo, hashed by path), separate
      # from graphify-out/ -- query/explain/path re-run extraction on every
      # call and rely on this to skip re-parsing unchanged files. Without a
      # writable mount here the process can't create it under /var/lib
      # (owned by root, not the container's non-root scos user) at all.
      - graphify-cache:/var/lib/graphify-cache
    depends_on:
      tls-certs:
        condition: service_completed_successfully
      memory-intelligence:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1:8099/health/ready"]
