services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scos_memory}
      POSTGRES_USER: ${POSTGRES_USER:-scos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/migrations/000001_initial.sql:/docker-entrypoint-initdb.d/000001_initial.sql:ro
      - ../../database/migrations/000002_governance_tables.sql:/docker-entrypoint-initdb.d/000002_governance_tables.sql:ro
      - ../../database/migrations/000003_control_plane.sql:/docker-entrypoint-initdb.d/000003_control_plane.sql:ro
      - ../../database/migrations/000004_autonomous_control_plane.sql:/docker-entrypoint-initdb.d/000004_autonomous_control_plane.sql:ro
      - ../../database/migrations/000005_extension_state.sql:/docker-entrypoint-initdb.d/000005_extension_state.sql:ro
      - ../../database/policies/000001_rls.sql:/docker-entrypoint-initdb.d/000005_rls.sql:ro
      - ../../database/policies/000002_control_plane_rls.sql:/docker-entrypoint-initdb.d/000006_control_plane_rls.sql:ro
      - ../../database/policies/000003_data_plane_rls.sql:/docker-entrypoint-initdb.d/000007_data_plane_rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  memory-gateway:
    build:
      context: ../..
      dockerfile: services/memory-gateway/Dockerfile
    restart: unless-stopped
    environment:
      SCOS_HTTP_ADDR: ${SCOS_HTTP_ADDR:-:8080}
      SCOS_VERSION: ${SCOS_VERSION:-0.1.0-dev}
      DATABASE_URL: postgres://${POSTGRES_USER:-scos}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-scos_memory}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10


  autonomous-control-plane:
    build:
      context: ../..
      dockerfile: services/autonomous-control-plane/Dockerfile
    restart: unless-stopped
    environment:
      SCOS_CONTROL_HTTP_ADDR: ${SCOS_CONTROL_HTTP_ADDR:-:8081}
      DATABASE_URL: postgres://${POSTGRES_USER:-scos}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-scos_memory}?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  consolidation-worker:
    build:
      context: ../..
      dockerfile: workers/consolidation/Dockerfile
    restart: unless-stopped
    environment:
      SCOS_DATABASE_URL: postgres://${POSTGRES_USER:-scos}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-scos_memory}?sslmode=disable
      SCOS_CONSOLIDATION_POLL_SECONDS: ${SCOS_CONSOLIDATION_POLL_SECONDS:-5}
      SCOS_CONSOLIDATION_BATCH_SIZE: ${SCOS_CONSOLIDATION_BATCH_SIZE:-10}
      SCOS_LOG_LEVEL: ${SCOS_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      memory-gateway:
        condition: service_started

  retrieval-orchestrator:
    build:
      context: ../..
      dockerfile: services/retrieval-orchestrator/Dockerfile
    restart: unless-stopped
    environment:
      SCOS_RETRIEVAL_HTTP_ADDR: ${SCOS_RETRIEVAL_HTTP_ADDR:-:8082}
