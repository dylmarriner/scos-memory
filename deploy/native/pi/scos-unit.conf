# Drop-in for scos-fabric@.service, scos-consolidation-worker.service and
# scos-fabric-migrations.service on a shared Raspberry Pi. See scos.slice.
[Service]
Slice=scos.slice
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=6
# Under memory pressure the kernel kills SCOS before the host's other apps;
# Restart=on-failure in the base unit brings it back.
OOMScoreAdjust=500
# Twenty-odd units logging to a small SD/USB root device.
LogRateLimitIntervalSec=30s
LogRateLimitBurst=200
