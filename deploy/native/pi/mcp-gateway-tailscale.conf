# Drop-in for scos-fabric@mcp-gateway.service: the gateway binds only to this
# host's Tailscale address (pi-setup.sh sets SCOS_MCP_GATEWAY_HTTP_ADDR), so it
# must not start before tailscaled has that address up.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=+/usr/bin/tailscale wait --timeout=2m
