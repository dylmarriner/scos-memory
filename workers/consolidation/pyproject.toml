[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scos-consolidation"
version = "0.1.0"
description = "Governed memory candidate models and consolidation worker foundation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scos_consolidation"]
