openapi: 3.1.0
info:
  title: SCOS Memory Gateway API
  version: 0.1.0
  description: Governed persistent memory and crash-recovery service for AI agents.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      operationId: live
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /health/ready:
    get:
      operationId: ready
      responses:
        '200':
          description: Required dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/version:
    get:
      operationId: version
      responses:
        '200':
          description: Service version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/sessions:
    post:
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session accepted and journaled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /v1/sessions/{sessionID}/messages:
    post:
      operationId: appendMessage
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: sessionID
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendMessageRequest'
      responses:
        '201':
          description: Message and turn committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReceipt'
  /v1/turns/{turnID}/chunks:
    post:
      operationId: appendResponseChunk
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: turnID
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendChunkRequest'
      responses:
        '201':
          description: Response chunk durably journaled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkReceipt'
  /v1/turns/{turnID}/response:
    post:
      operationId: startAssistantResponse
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: turnID
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201':
          description: Assistant response message allocated for streaming.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartResponseReceipt'
  /v1/turns/{turnID}/complete:
    post:
      operationId: completeTurn
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: turnID
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTurnRequest'
      responses:
        '201':
          description: Reply, checkpoint, event, and outbox job committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionReceipt'
  /v1/turns:
    get:
      operationId: listTurns
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Permission-scoped journal turns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnList'
  /v1/memory:
    get:
      operationId: queryMemory
      responses:
        '200': {description: Current memory facts view}
    post:
      operationId: retainMemory
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Memory fact accepted by the current memory intelligence service}
  /v1/okf:
    get:
      operationId: okfStatus
      responses:
        '200': {description: Current OKF documents discovered by the synchroniser}
  /v1/operations:
    post:
      operationId: prepareOperation
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareOperationRequest'
      responses:
        '201':
          description: Side-effecting operation durably prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReceipt'
  /v1/control/route:
    post:
      operationId: routeInteraction
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Explainable route decision}
  /v1/control/ingest:
    post:
      operationId: controlIngest
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Persisted control-plane route decision}
  /v1/control/decisions:
    get:
      operationId: listControlDecisions
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - name: interaction_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Route decision for the requested interaction}
        '404': {description: Route decision not found}
  /v1/control/replay:
    post:
      operationId: controlReplay
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Persisted decision read and validated; no execution is performed}
  /v1/control/recover:
    post:
      operationId: controlRecover
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '202': {description: Recovery state transition accepted}
  /v1/control/status:
    get:
      operationId: getControlLifecycleStatus
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - name: interaction_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Truthful persisted lifecycle, reply, checkpoint, and outbox status}
        '404': {description: Interaction not found}
  /v1/control/status/{interactionID}:
    get:
      operationId: getControlLifecycleStatusByInteraction
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - name: interactionID
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Truthful persisted lifecycle, reply, checkpoint, and outbox status}
        '404': {description: Interaction not found}
  /v1/control/decisions/{interactionID}:
    get:
      operationId: getRouteDecision
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/PrincipalID'
        - name: interactionID
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Latest permission-scoped route decision}
        '404': {description: Route decision not found}
  /v1/context/compile:
    post:
      operationId: compileContext
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Reversible compiled context capsule}
  /v1/context/restore:
    post:
      operationId: restoreContext
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Restored authoritative context}
  /v1/context/evaluate:
    post:
      operationId: evaluateContext
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Context invariant evaluation metrics}
  /v1/code/index:
    post:
      operationId: indexCode
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Code index generation result}
  /v1/code/query:
    post:
      operationId: queryCode
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Permission-scoped code query results}
  /v1/code/impact:
    post:
      operationId: analyseCodeImpact
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Change impact analysis}
  /v1/proxy/execute:
    post:
      operationId: executeThroughProxy
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Audited execution result}
  /v1/proxy/restore:
    get:
      operationId: proxyRestoreByQuery
      parameters:
        - name: restoration_handle
          in: query
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200': {description: Restored raw execution result}
  /v1/proxy/explain:
    post:
      operationId: proxyExplain
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Command plan and applicable rewrite explanations}
  /v1/extensions/install:
    post:
      operationId: installExtension
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Governed installation receipt}
  /v1/transparency/stream:
    get:
      operationId: transparencyStream
      responses:
        '200': {description: Authorised server-sent transparency events}
  /v1/users/{user_id}/knowledge:
    get:
      operationId: userKnowledge
      parameters:
        - name: user_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Versioned user knowledge ledger}
  /v1/audit:
    get:
      operationId: getAuditLogs
      responses:
        '200': {description: Immutable security audit entries}
  /v1/secrets:
    get:
      operationId: listSecretReferences
      responses:
        '200': {description: Secret references for the authenticated tenant (never secret values)}
    post:
      operationId: upsertSecretReference
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Secret reference created or updated}
        '400': {description: Missing fields or unsupported provider}
  /v1/secrets/{id}:
    get:
      operationId: getSecretReference
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Secret reference metadata (never the secret value)}
        '404': {description: Secret reference not found}
  /v1/secrets/{id}/resolve:
    post:
      operationId: resolveSecretReference
      description: >-
        Resolves a securestore-provider SecretReference to its live value via
        the Securestore platform. Fails closed (502/503) if Securestore is
        unreachable, returns approval_required, or the integration is not
        configured. Never caches or persists the resolved value.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Resolved secret value from Securestore}
        '400': {description: Secret reference provider is not securestore}
        '404': {description: Secret reference not found}
        '502': {description: Securestore unreachable or returned an error}
        '503': {description: Securestore integration not configured, or approval required}
  /v1/capabilities:
    get:
      operationId: listCapabilities
      responses:
        '200': {description: Capability registry entries}
  /v1/triggers:
    post:
      operationId: triggerControlIngress
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Trigger represented as a control-plane route ingestion request}
  /v1/retrieval-runs:
    post:
      operationId: createRetrievalRun
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object}}
      responses:
        '200': {description: Retrieval result with source and timing metadata}
  /v1/benchmarks:
    get:
      operationId: runBenchmarks
      responses:
        '200':
          description: Measured results from the frozen governance quality benchmark suite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkSummary'
        '405': {description: Method not allowed}
  /v1/proxy/restore/{restorationHandle}:
    get:
      operationId: proxyRestore
      parameters:
        - name: restorationHandle
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200': {description: Restored raw execution result}
  /v1/extensions:
    get:
      operationId: listExtensions
      responses:
        '200': {description: Installed extension packages}
  /v1/extensions/{package_id}:
    get:
      operationId: getExtension
      parameters: [{name: package_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Extension package details}
  /v1/extensions/{package_id}/enable:
    post:
      operationId: enableExtension
      parameters: [{name: package_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Extension enabled status}
  /v1/extensions/{package_id}/disable:
    post:
      operationId: disableExtension
      parameters: [{name: package_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Extension disabled status}
  /v1/extensions/{package_id}/rollback:
    post:
      operationId: rollbackExtension
      parameters: [{name: package_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Extension rolled back to the most recent retained manifest}
  /v1/skills:
    get:
      operationId: listSkills
      responses:
        '200': {description: Registered skill definitions}
  /v1/hooks:
    get:
      operationId: listHooks
      responses:
        '200': {description: Registered lifecycle hooks}
  /v1/hooks/executions:
    get:
      operationId: listHookExecutions
      responses:
        '200': {description: History of hook executions}
  /v1/adapters:
    get:
      operationId: listAdapters
      responses:
        '200': {description: Supported agent runtime adapters}
  /v1/compatibility:
    get:
      operationId: getCompatibilityStatus
      responses:
        '200': {description: Compatibility gateway status report}
  /v1/entities:
    get:
      operationId: listEntities
      responses:
        '200': {description: Modelled entity representations}
  /v1/entities/{entity_id}/representation:
    get:
      operationId: getEntityRepresentation
      parameters: [{name: entity_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Entity and its currently associated facts}
  /v1/memory/graph:
    get:
      operationId: getMemoryGraph
      responses:
        '200': {description: Current in-memory facts, entities, and relations graph}
  /v1/beliefs:
    get:
      operationId: listBeliefs
      responses:
        '200': {description: User belief revisions and evidence}
  /v1/learnings:
    get:
      operationId: listLearnings
      responses:
        '200': {description: Current learning dashboard view}
  /v1/diary:
    get:
      operationId: getDiary
      responses:
        '200': {description: Current diary view; empty when no diary entries are persisted}
  /v1/transparency/snapshot:
    get:
      operationId: getTransparencySnapshot
      responses:
        '200': {description: System transparency snapshot}
  /v1/transparency/events:
    get:
      operationId: getTransparencyEvents
      responses:
        '200': {description: Audit event log stream}
components:
  parameters:
    TenantID:
      name: X-SCOS-Tenant-ID
      in: header
      required: true
      schema: {type: string, format: uuid}
    PrincipalID:
      name: X-SCOS-Principal-ID
      in: header
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    CreateSessionRequest:
      type: object
      required: [namespace_id]
      properties:
        namespace_id: {type: string, format: uuid}
    Session:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    AppendMessageRequest:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant, tool]}
        content: {type: string, minLength: 1}
    AppendChunkRequest:
      type: object
      required: [message_id, chunk_sequence, content]
      properties:
        message_id: {type: string, format: uuid}
        chunk_sequence: {type: integer, minimum: 0}
        content: {type: string, minLength: 1}
    ChunkReceipt:
      type: object
      required: [turn_id, message_id, chunk_sequence]
      properties:
        turn_id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        chunk_sequence: {type: integer, minimum: 0}
    StartResponseReceipt:
      type: object
      required: [turn_id, message_id, status]
      properties:
        turn_id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        status: {type: string, enum: [running]}
    MessageReceipt:
      type: object
      required: [turn_id, message_id, sequence]
      properties:
        turn_id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64}
    TurnList:
      type: object
      required: [turns, limit]
      properties:
        turns:
          type: array
          items: {$ref: '#/components/schemas/Turn'}
        limit: {type: integer, minimum: 1, maximum: 100}
    Turn:
      type: object
      required: [id, session_id, sequence, status, actor_id, accepted_at, agent_id, started_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64}
        status: {type: string}
        actor_id: {type: string, format: uuid}
        agent_id: {type: [string, 'null'], format: uuid}
        accepted_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
    CompleteTurnRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, minLength: 1}
        state: {type: object}
    CompletionReceipt:
      type: object
      required: [turn_id, message_id, checkpoint_id]
      properties:
        turn_id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        checkpoint_id: {type: string, format: uuid}
    PrepareOperationRequest:
      type: object
      required: [tool_name, tool_version, input]
      properties:
        tool_name: {type: string, minLength: 1}
        tool_version: {type: string, minLength: 1}
        input: {type: object}
        expected_effects: {type: object}
        retry_policy: {type: object}
        reconciliation_method: {type: string}
    OperationReceipt:
      type: object
      required: [operation_id, status]
      properties:
        operation_id: {type: string, format: uuid}
        status: {type: string, enum: [prepared]}
    BenchmarkSummary:
      type: object
      required: [suite, version, total_cases, average_scores, total_latency_ms, avg_latency_ms, results]
      properties:
        suite: {type: string}
        version: {type: string}
        total_cases: {type: integer, minimum: 1}
        average_scores:
          type: object
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        total_latency_ms: {type: number, minimum: 0}
        avg_latency_ms: {type: number, minimum: 0}
        results:
          type: array
          minItems: 1
          items:
            type: object
            required: [case_id, retrieved_ids, latency_ms, scores]
            properties:
              case_id: {type: string}
              retrieved_ids:
                type: array
                items: {type: string}
              latency_ms: {type: number, minimum: 0}
              scores:
                type: object
                additionalProperties: {type: number, minimum: 0, maximum: 1}
