name: Feature request
description: Propose a new capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or painful today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Who needs this and when?
    validations:
      required: true

  - type: checkboxes
    id: governance
    attributes:
      label: Governance impact
      options:
        - label: This may require a new or updated ADR (docs/adr/).
        - label: This may require a change to GOVERNANCE.md.

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
