name: P4 Apply Worker Integration

on:
  push:
    branches:
      - "feat/p4-hybrid-retrieval"
    paths:
      - ".github/p4-patcher/apply_worker.py"
      - ".github/workflows/p4-apply-worker.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p4-hybrid-retrieval
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Apply exact-space worker transformation
        run: python3 .github/p4-patcher/apply_worker.py
      - name: Install worker dependencies
        run: python -m pip install -e workers/embeddings
      - name: Test worker
        run: python -m unittest discover -s workers/embeddings/tests -p 'test_*.py' -v
      - name: Test schema contract
        run: go test -count=1 ./database/migrations
      - name: Commit verified worker/schema transformation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/embeddings/src/scos_embeddings/worker.py database/migrations/000036_embedding_spaces_and_code_embeddings.sql
          if git diff --cached --quiet; then
            echo "No worker/schema changes to commit"
            exit 0
          fi
          git commit -m "feat(p4): persist explicit memory embedding spaces"
          git push origin HEAD:feat/p4-hybrid-retrieval
