name: Model Runtime

on:
  pull_request:
    paths:
      - "services/model-runtime/**"
      - "workers/embeddings/**"
      - "deploy/compose/docker-compose.models.yml"
      - "deploy/scripts/auto-deploy.sh"
      - ".env.example"
      - ".github/workflows/model-runtime.yml"
      - "docs/model-runtime.md"
      - "docs/superpowers/specs/2026-09-09-model-runtime-bge-design.md"
      - "docs/superpowers/plans/2026-09-09-model-runtime-bge.md"
  push:
    branches:
      - "main"
      - "fix/bge-current-main"
    paths:
      - "services/model-runtime/**"
      - "workers/embeddings/**"
      - "deploy/compose/docker-compose.models.yml"
      - "deploy/scripts/auto-deploy.sh"
      - ".env.example"
      - ".github/workflows/model-runtime.yml"

permissions:
  contents: read

concurrency:
  group: model-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-runtime:
    name: Go runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Focused gofmt
        run: |
          diff=$(gofmt -l services/model-runtime)
          if [ -n "$diff" ]; then
            echo "gofmt needs to be run on:"; echo "$diff"; exit 1
          fi
      - name: Focused go vet
        run: go vet ./services/model-runtime/cmd/server
      - name: Focused Go tests
        run: go test -count=1 ./services/model-runtime/cmd/server
      - name: Build runtime container
        run: docker build -f services/model-runtime/Dockerfile -t scos-model-runtime:ci .

  embeddings-worker:
    name: Embedding model-space regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install embedding worker
        run: pip install -e workers/embeddings
      - name: Compile worker
        run: python3 -m compileall -q workers/embeddings
      - name: Run embedding worker tests
        run: python3 -m unittest discover -s workers/embeddings/tests -v

  hosted-deployment:
    name: Hosted deployment syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate auto-deploy shell syntax
        run: bash -n deploy/scripts/auto-deploy.sh
      - name: Validate merged Compose model overlay
        env:
          COMPOSE_PROFILES: text-model,rerank-model,code-model
          SCOS_MODEL_RUNTIME_ENABLED: "true"
          SCOS_INTERNAL_SERVICE_TOKEN: ci-internal-token
          SCOS_CONTROL_PLANE_TOKEN: ci-control-token
          SCOS_SECURITY_ISSUER_SECRET: ci-issuer-secret
          POSTGRES_PASSWORD: ci-postgres-password
          SCOS_DATABASE_URL: postgresql://scos:ci@postgres:5432/scos_memory?sslmode=require
          SCOS_APP_PASSWORD: ci-app-password
          SCOS_APP_DATABASE_URL: postgresql://scos_app:ci@postgres:5432/scos_memory?sslmode=require
          SCOS_WORKER_PASSWORD: ci-worker-password
          SCOS_WORKER_DATABASE_URL: postgresql://scos_worker:ci@postgres:5432/scos_memory?sslmode=require
          SCOS_CREDENTIAL_VAULT_MASTER_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          GRAPHIFY_WORKSPACE_HOST_PATH: /tmp
          CONTROL_PLANE_API_KEY: ci-openai-control-key
          CONTROL_PLANE_TUNNEL_ID: ci-tunnel-id
          SCOS_GATEWAY_AUTHORIZATION: Bearer ci-gateway-token
          SCOS_PUBLIC_GATEWAY_URL: https://example.invalid/mcp
        run: |
          docker compose \
            -f deploy/compose/docker-compose.yml \
            -f deploy/compose/docker-compose.models.yml \
            config >/dev/null
