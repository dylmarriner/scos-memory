name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true
      - name: gofmt
        run: |
          diff=$(gofmt -l $(find services packages adapters workers -name '*.go' -type f))
          if [ -n "$diff" ]; then
            echo "gofmt needs to be run on:"; echo "$diff"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  python:
    name: Python compile, unit tests, schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install worker dependencies
        run: |
          pip install -e workers/consolidation
          pip install -e workers/embeddings
      - name: Compile check
        run: python3 -m compileall -q workers/consolidation workers/embeddings workers/index-maintenance workers/policy-evaluation integrations/hermes/plugins/scos
      - name: Unit tests
        run: |
          python3 -m unittest discover -s workers/consolidation/tests -v
          PYTHONPATH=packages/benchmark-harness/python python3 -m unittest discover -s packages/benchmark-harness/python/tests -p "test_*.py" -v
          python3 -m unittest discover -s tests -p test_benchmark_ranking_uniqueness.py -v
          python3 -m unittest discover -s tests -p test_benchmark_harness.py -v
          python3 -m unittest discover -s tests -p test_benchmark_suite_schema.py -v
          python3 -m unittest discover -s tests -p test_deployed_benchmark.py -v
          python3 -m unittest discover -s tests -p test_postgres_dns_doctor.py -v
          python3 -m unittest discover -s workers/embeddings/tests -v
          python3 -m unittest discover -s workers/index-maintenance -p "test_*.py" -v
          python3 -m unittest scripts/test_scos_git_worklist.py \
            scripts/test_scos_verify_snapshot_manifest.py \
            scripts/test_scos_verify_snapshot_events.py \
            scripts/test_scos_verify_snapshot_bundle.py -v
          python3 -m unittest discover -s tests -p test_definition_of_done_evidence.py -v
          python3 -m unittest discover -s tests -p test_p6_rls_source_evidence.py -v
          python3 -m unittest discover -s tests -p test_p7_integration_ci_gate.py -v
          python3 -m unittest discover -s workers/policy-evaluation -p "test_*.py" -v
          python3 -m unittest discover -s integrations/hermes/plugins/scos -p "test_*.py" -v
          python3 tests/failure-injection/test_runner.py -v
          python3 tests/test_ci_supply_chain.py -v
          python3 -m unittest discover -s tests -p test_make_test_parity.py -v
      - name: JSON Schema validation
        run: python3 scripts/validate_json.py
      - name: Governance structural audit
        run: python3 scripts/audit_governance.py

  openclaw:
    name: OpenClaw memory plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
      - name: Install dependencies
        working-directory: integrations/openclaw/plugin
        run: npm install --ignore-scripts
      - name: Contract tests
        working-directory: integrations/openclaw/plugin
        run: npm test
      - name: Package validation
        working-directory: integrations/openclaw/plugin
        run: npm run pack:check

  security:
    name: Supply chain (vuln scan, secrets, SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true

      # Fail closed: an actionable Go standard-library vulnerability must
      # fail this required job, not produce a misleading green supply-chain CI.
      - name: Go vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Python dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          # Audit the project's resolved dependencies. Installing it editable
          # and passing --skip-editable fails under --strict, which treats
          # the skipped local package as an audit failure.
          pip-audit --strict workers/consolidation

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (CycloneDX, Go modules)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output sbom.json .

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  docker:
    name: Container image build + scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f deploy/Dockerfile -t scos-fabric:ci .
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scos-fabric:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # Without this the action builds the SARIF report from every
          # severity and exit-code fires on LOW/MEDIUM findings too.
          limit-severities-for-sarif: true
          exit-code: "1"
      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
