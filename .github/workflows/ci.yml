name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: |
          diff=$(gofmt -l $(find services packages adapters workers -name '*.go' -type f))
          if [ -n "$diff" ]; then
            echo "gofmt needs to be run on:"; echo "$diff"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  sql-schema:
    name: SQL statements prepare against migrated schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scos
          POSTGRES_PASSWORD: scos-ci
          POSTGRES_DB: scos_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U scos -d scos_memory"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGPASSWORD: scos-ci
      DATABASE_URL: postgresql://scos:scos-ci@127.0.0.1:5432/scos_memory?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply all migrations and policies from zero
        run: |
          for file in database/migrations/*.sql database/policies/*.sql; do
            psql -h 127.0.0.1 -U scos -d scos_memory -v ON_ERROR_STOP=1 \
              -v app_password=ci-app -v worker_password=ci-worker -v backup_password=ci-backup -f "$file"
          done
          psql -h 127.0.0.1 -U scos -d scos_memory -v ON_ERROR_STOP=1 -c "SELECT scos_reconcile_backup_role()"
      - name: Every static SQL statement prepares
        run: go test -tags=integration -count=1 -run TestAllSQLStatementsPrepare -v ./database/integration
      - name: Store integration tests against the migrated schema
        env:
          SCOS_MEMORY_STORE_TEST_DSN: ${{ env.DATABASE_URL }}
          SCOS_OKF_STORE_TEST_DSN: ${{ env.DATABASE_URL }}
          SCOS_CODE_STORE_TEST_DSN: ${{ env.DATABASE_URL }}
          SCOS_TOOL_GOVERNANCE_TEST_DSN: ${{ env.DATABASE_URL }}
          SCOS_AGENT_REGISTRY_TEST_DSN: ${{ env.DATABASE_URL }}
          SCOS_RETRIEVAL_TEST_DSN: ${{ env.DATABASE_URL }}
          SCOS_HERMES_STORE_TEST_DSN: ${{ env.DATABASE_URL }}
          # hermes-provider handlers run as the restricted runtime role, so its
          # RLS policies are exercised, not bypassed by the owner.
          SCOS_HERMES_APP_TEST_DSN: postgresql://scos_app:ci-app@127.0.0.1:5432/scos_memory?sslmode=disable
        run: |
          go test -count=1 -run 'TestPG' -v ./services/memory-intelligence/cmd/server ./services/okf-synchroniser/cmd/server ./services/code-intelligence/cmd/server
          go test -count=1 -run 'TestPG|TestP4' -v ./services/retrieval-orchestrator/cmd/server ./services/hermes-provider/cmd/server
          go test -count=1 -v ./services/tool-governance/cmd/server ./services/agent-registry/cmd/server

  python:
    name: Python compile, unit tests, schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install worker dependencies
        run: |
          pip install -e workers/consolidation
          pip install -e workers/embeddings
      - name: Compile check
        run: python3 -m compileall -q workers/consolidation workers/embeddings workers/index-maintenance workers/policy-evaluation
      - name: Unit tests
        run: |
          python3 -m unittest discover -s workers/consolidation/tests -v
          python3 -m unittest discover -s workers/embeddings/tests -v
          python3 -m unittest discover -s workers/index-maintenance -p "test_*.py" -v
          python3 -m unittest discover -s workers/policy-evaluation -p "test_*.py" -v
          python3 -m unittest discover -s tests -p "test_benchmark*.py" -v
          python3 tests/failure-injection/test_runner.py -v
          for t in test_compose_security test_auto_persist_hooks test_auto_recall_hooks test_mcp_bridge test_hermes_scos_memory_plugin; do
            python3 -m unittest discover -s tests -p "$t.py" -v
          done
      - name: Verify frozen benchmark evidence baseline
        run: python3 benchmarks/verify_frozen.py
      - name: JSON Schema validation
        run: python3 scripts/validate_json.py
      - name: Governance structural audit
        run: python3 scripts/audit_governance.py

  security:
    name: Supply chain (vuln scan, secrets, SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # govulncheck@v1.7.0 (the latest available release as of this module's
      # Go 1.26 upgrade) predates Go 1.26 and refuses to analyze a module
      # that requires it ("application built with go1.25"). This is an
      # upstream x/vuln release-cadence lag, not a project issue -- remove
      # continue-on-error once a govulncheck release supporting go1.26 ships.
      - name: Go vulnerability scan (govulncheck)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Python dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip install -e workers/consolidation
          pip-audit --strict --skip-editable

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (CycloneDX, Go modules)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output sbom.json .

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  docker:
    name: Container image build + scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/Dockerfile -t scos-fabric:ci .
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: scos-fabric:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
