name: P4 Apply Code Hybrid

on:
  push:
    branches:
      - "feat/p4-hybrid-retrieval"
    paths:
      - ".github/p4-patcher/apply_code_hybrid.py"
      - ".github/workflows/p4-apply-code-hybrid.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p4-hybrid-retrieval
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Apply code hybrid transformations
        run: python3 .github/p4-patcher/apply_code_hybrid.py
      - name: Format
        run: gofmt -w services/code-intelligence/cmd/server/*.go
      - name: Vet
        run: go vet ./services/code-intelligence/cmd/server
      - name: Test
        run: go test -count=1 ./services/code-intelligence/cmd/server
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/code-intelligence/cmd/server/main.go services/code-intelligence/cmd/server/pgstore.go services/code-intelligence/cmd/server/pghandlers.go
          if git diff --cached --quiet; then
            echo "No code-hybrid changes to commit"
            exit 0
          fi
          git commit -m "feat(p4): integrate BGE-Code hybrid retrieval"
          git push origin HEAD:feat/p4-hybrid-retrieval
